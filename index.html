<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2b1f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dayslayer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Slay your day. Track tasks, interruptions, and insights.">
  <title>Wildman Dayslayer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #fdf6e8;
      --bg: #2b1f14;
      --text: #2c1a0e;
      --text-soft: #7a5c3e;
      --text-faded: #b09070;
      --line: #e8d8c0;
      --accent: #3d5e35;
      --accent-soft: #5e8a52;
      --success: #4a7c5e;
      --success-soft: #70a882;
      --danger: #b84040;
      --interrupt: #9b4a3a;
      --interrupt-soft: #c47060;
      --learned: #a07830;
      --learned-soft: #c49b50;
      --shadow: rgba(43, 31, 20, 0.15);
    }

    html {
      background: var(--bg);
    }

    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.6;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 540px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      padding: 2rem 1.5rem 1rem;
      text-align: center;
    }

    .header h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--paper);
      letter-spacing: 0.02em;
      margin-bottom: 0.25rem;
    }

    .header p {
      font-size: 0.9rem;
      color: rgba(253, 246, 232, 0.55);
      font-style: italic;
    }

    /* Tab Navigation - like notebook dividers */
    .tabs {
      display: flex;
      margin: 0 0.75rem;
      gap: 2px;
      position: relative;
      z-index: 20;
    }

    .tab {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: var(--bg);
      border: none;
      border-radius: 8px 8px 0 0;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .tab svg {
      width: 16px;
      height: 16px;
      opacity: 0.6;
    }

    .tab:hover {
      background: var(--line);
    }

    .tab.active {
      background: var(--paper);
      color: var(--text);
      box-shadow: 0 -2px 8px var(--shadow);
    }

    .tab.active svg {
      opacity: 1;
    }

    .tab[data-tab="tasks"].active {
      color: var(--accent);
    }

    .tab[data-tab="interruptions"].active {
      color: var(--interrupt);
    }

    .tab[data-tab="learned"].active {
      color: var(--learned);
    }

    .tab .count {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      background: var(--line);
      color: var(--text-soft);
    }

    .tab.active .count {
      background: currentColor;
      color: white;
    }

    /* The notepad paper area */
    .paper {
      flex: 1;
      background: var(--paper);
      margin: 0 0.75rem;
      box-shadow:
        0 2px 8px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.8);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Subtle ruled lines effect */
    .paper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--line) 31px,
        var(--line) 32px
      );
      pointer-events: none;
      opacity: 0.5;
    }

    /* Margin line - color changes based on active tab */
    .paper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 2.5rem;
      width: 1px;
      background: #c0d0b0;
      pointer-events: none;
      transition: background 0.3s;
    }

    .paper.interruptions::after {
      background: #d4b0a0;
    }

    .paper.learned::after {
      background: #d4c490;
    }

    /* Add entry area */
    .add-entry {
      padding: 1rem 1rem 1rem 3rem;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 10;
      background: var(--paper);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 0;
      background: transparent;
      border: none;
      border-bottom: 2px dashed var(--line);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-bottom-style: solid;
    }

    .tab-tasks input[type="text"]:focus {
      border-bottom-color: var(--accent-soft);
    }

    .tab-interruptions input[type="text"]:focus {
      border-bottom-color: var(--interrupt-soft);
    }

    .tab-learned input[type="text"]:focus {
      border-bottom-color: var(--learned-soft);
    }

    input[type="text"]::placeholder {
      color: var(--text-faded);
      font-style: italic;
    }

    .btn-add {
      width: 36px;
      height: 36px;
      padding: 0;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .tab-tasks .btn-add {
      background: var(--accent);
    }

    .tab-interruptions .btn-add {
      background: var(--interrupt);
    }

    .tab-learned .btn-add {
      background: var(--learned);
    }

    .btn-add:hover {
      transform: scale(1.05);
      filter: brightness(0.9);
    }

    .btn-add:active {
      transform: scale(0.95);
    }

    /* Entry list */
    .entries {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
      position: relative;
      z-index: 5;
    }

    .entry {
      padding: 0.875rem 1rem 0.875rem 3rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      position: relative;
      transition: background 0.15s;
    }

    .entry:hover {
      background: rgba(180, 150, 100, 0.12);
    }

    .entry.completed {
      opacity: 0.6;
    }

    /* Entry marker - different for each type */
    .entry-marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Task checkbox */
    .entry-marker.task {
      border: 2px solid var(--text-faded);
    }

    .entry-marker.task:hover {
      border-color: var(--success);
    }

    .entry.completed .entry-marker.task {
      background: var(--success);
      border-color: var(--success);
    }

    .entry.completed .entry-marker.task::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 6px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Interruption marker - lightning bolt */
    .entry-marker.interruption {
      background: var(--interrupt-soft);
      border: none;
    }

    .entry-marker.interruption svg {
      width: 12px;
      height: 12px;
      stroke: white;
      fill: none;
    }

    /* Learned marker - lightbulb */
    .entry-marker.learned {
      background: var(--learned-soft);
      border: none;
    }

    .entry-marker.learned svg {
      width: 12px;
      height: 12px;
      stroke: white;
      fill: none;
    }

    .entry-content {
      flex: 1;
      min-width: 0;
    }

    .entry-text {
      font-size: 1rem;
      word-wrap: break-word;
      cursor: pointer;
      padding: 2px 0;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .entry-text:hover {
      color: var(--accent);
    }

    .entry.interruption .entry-text:hover {
      color: var(--interrupt);
    }

    .entry.learned .entry-text:hover {
      color: var(--learned);
    }

    /* Completed task styling */
    .entry.completed .entry-text {
      color: var(--text-soft);
      text-decoration: line-through;
      text-decoration-color: var(--success-soft);
      text-decoration-thickness: 2px;
      font-style: italic;
    }

    /* Entry actions */
    .entry-actions {
      display: flex;
      gap: 0.25rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .entry:hover .entry-actions {
      opacity: 1;
    }

    .btn-action {
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text-soft);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .btn-action:hover {
      background: var(--bg);
      border-color: var(--text-soft);
      color: var(--text);
    }

    .btn-action.delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-action.confirm:hover {
      border-color: var(--danger);
      background: var(--danger);
      color: white;
    }

    /* Inline delete confirmation row */
    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--danger);
    }

    /* Media buttons */
    .media-buttons {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .entry:hover .media-buttons,
    .entry:focus-within .media-buttons {
      opacity: 1;
    }

    .btn-media {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-media:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-media.recording {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    .btn-media svg {
      width: 14px;
      height: 14px;
    }

    /* Attachments */
    .attachments {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .attachment {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line);
    }

    .attachment img,
    .attachment video {
      display: block;
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      background: var(--bg);
    }

    .attachment audio {
      display: block;
      width: 100%;
      height: 40px;
    }

    .btn-remove-attachment {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      width: 22px;
      height: 22px;
      padding: 0;
      background: rgba(61, 58, 52, 0.7);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-remove-attachment:hover {
      background: var(--danger);
      transform: scale(1.1);
    }

    .audio-attachment {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
    }

    .audio-attachment audio {
      flex: 1;
    }

    .audio-attachment .btn-remove-attachment {
      position: static;
      flex-shrink: 0;
    }

    /* Edit input */
    .edit-input {
      width: 100%;
      padding: 0.5rem 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }

    .edit-input:focus {
      outline: none;
    }

    /* Empty states */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-soft);
    }

    .empty-state .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state svg {
      width: 36px;
      height: 36px;
    }

    .empty-state h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.75rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      font-size: 0.95rem;
      font-style: italic;
      max-width: 280px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Empty state colors by type */
    .empty-state.tasks svg {
      stroke: var(--accent-soft);
    }
    .empty-state.tasks h2 {
      color: var(--accent);
    }

    .empty-state.interruptions svg {
      stroke: var(--interrupt-soft);
    }
    .empty-state.interruptions h2 {
      color: var(--interrupt);
    }

    .empty-state.learned svg {
      stroke: var(--learned-soft);
    }
    .empty-state.learned h2 {
      color: var(--learned);
    }

    /* Error state */
    .error-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--danger);
    }

    .error-state p {
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .error-state button {
      padding: 0.5rem 1.25rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }

    /* Footer stats */
    .stats {
      padding: 0.875rem 1.5rem;
      background: var(--paper);
      margin: 0 0.75rem;
      border-radius: 0 0 4px 4px;
      box-shadow:
        0 2px 8px var(--shadow),
        inset 0 1px 0 var(--line);
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .stats .highlight {
      font-weight: 600;
    }

    .stats .tasks-stat {
      color: var(--success);
    }

    .stats .interrupt-stat {
      color: var(--interrupt);
    }

    .stats .learned-stat {
      color: var(--learned);
    }

    /* Bottom breathing room */
    .bottom-space {
      height: 1.5rem;
    }

    /* Slide in animation */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .entry {
      animation: slideIn 0.25s ease;
    }

    /* Touch-friendly */
    @media (hover: none) {
      .entry-actions {
        opacity: 1;
      }

      .media-buttons {
        opacity: 1;
      }
    }

    /* Larger screens */
    @media (min-width: 600px) {
      .header {
        padding: 2.5rem 2rem 1rem;
      }

      .header h1 {
        font-size: 3rem;
      }

      .tabs {
        margin: 0 1.5rem;
      }

      .paper {
        margin: 0 1.5rem;
      }

      .stats {
        margin: 0 1.5rem;
        border-radius: 0 0 6px 6px;
      }

      .add-entry {
        padding: 1.25rem 1.25rem 1.25rem 3.5rem;
      }

      .entry {
        padding: 1rem 1.25rem 1rem 3.5rem;
      }

      .paper::after {
        left: 3rem;
      }

      .bottom-space {
        height: 2rem;
      }
    }

    /* PWA Install Banner */
    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--paper);
      padding: 1rem 1.25rem;
      box-shadow: 0 -4px 20px rgba(61, 58, 52, 0.15);
      display: none;
      align-items: center;
      gap: 1rem;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .install-banner.show {
      display: flex;
    }

    .install-banner-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .install-banner-content {
      flex: 1;
      min-width: 0;
    }

    .install-banner-title {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 0.15rem;
    }

    .install-banner-text {
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    .install-banner-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn-install {
      padding: 0.6rem 1.25rem;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-install:hover {
      filter: brightness(0.9);
      transform: scale(1.02);
    }

    .btn-dismiss {
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-soft);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-dismiss:hover {
      background: var(--bg);
      color: var(--text);
    }

    /* Offline indicator */
    .offline-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--text);
      color: white;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
      z-index: 1001;
    }

    .offline-indicator.show {
      transform: translateY(0);
    }

    /* Update available banner */
    .update-banner {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--paper);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(61, 58, 52, 0.2);
      display: none;
      align-items: center;
      gap: 1rem;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .update-banner.show {
      display: flex;
    }

    .update-banner span {
      font-size: 0.9rem;
      color: var(--text);
    }

    .btn-update {
      padding: 0.4rem 0.875rem;
      background: var(--success);
      border: none;
      border-radius: 4px;
      color: white;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-update:hover {
      filter: brightness(0.9);
    }

    /* Camera / video capture modal */
    .capture-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(43, 31, 20, 0.97);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .capture-modal-preview {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    .capture-modal-preview video {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .capture-modal-actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    .btn-capture-primary {
      padding: 0.875rem 2rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-capture-record {
      padding: 0.875rem 2rem;
      background: #c96b6b;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-capture-record.recording {
      background: var(--success-soft);
    }

    .btn-capture-cancel {
      padding: 0.875rem 2rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <!-- Offline indicator -->
  <div class="offline-indicator" id="offlineIndicator">
    You're offline. Changes will sync when connected.
  </div>

  <!-- Update available banner -->
  <div class="update-banner" id="updateBanner">
    <span>A new version is available!</span>
    <button class="btn-update" id="updateBtn">Update</button>
  </div>

  <!-- Install prompt banner -->
  <div class="install-banner" id="installBanner">
    <img class="install-banner-icon" src="icons/icon-96.png" alt="Wildman Dayslayer">
    <div class="install-banner-content">
      <div class="install-banner-title">Install Dayslayer</div>
      <div class="install-banner-text">Add to your home screen for quick access</div>
    </div>
    <div class="install-banner-actions">
      <button class="btn-install" id="installBtn">Install</button>
      <button class="btn-dismiss" id="dismissBtn">&times;</button>
    </div>
  </div>

  <div class="app">
    <header class="header">
      <h1>Wildman Dayslayer</h1>
      <p id="greeting">What matters most?</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <span>Tasks</span>
        <span class="count" id="tasksCount">0</span>
      </button>
      <button class="tab" data-tab="interruptions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span>Interruptions</span>
        <span class="count" id="interruptionsCount">0</span>
      </button>
      <button class="tab" data-tab="learned">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
        </svg>
        <span>Learned</span>
        <span class="count" id="learnedCount">0</span>
      </button>
    </nav>

    <main class="paper tab-tasks" id="paper">
      <div class="add-entry">
        <form id="entryForm" class="input-group">
          <input
            type="text"
            id="entryInput"
            placeholder="What's on your mind?"
            autocomplete="off"
          >
          <button type="submit" class="btn-add" aria-label="Add entry">+</button>
        </form>
      </div>

      <div class="entries" id="entryList"></div>
    </main>

    <footer class="stats">
      <span id="statsLeft">Ready to slay</span>
      <span id="statsRight"></span>
    </footer>

    <div class="bottom-space"></div>
  </div>

  <script>
    // ==========================================
    // DB constants
    // v1: entries store with type index
    // v2-v3: UI-only changes, no schema changes
    // v4: attachments object store for Blob storage
    // ==========================================
    const DB_NAME = 'DayslayerDB';
    const DB_VERSION = 4;
    const STORE_NAME = 'entries';
    const ATTACH_STORE = 'attachments';

    let db;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingEntryId = null;
    let currentAudioMime = '';
    let currentTab = 'tasks';

    // UI state — not stored in entry records
    let editingId = null;
    let pendingDeleteId = null;

    // Cache of attachment ID → { url, type } for the current render
    const objectUrlCache = new Map();

    // Supported MIME type candidates in priority order
    const AUDIO_MIME_CANDIDATES = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/mp4'
    ];
    const VIDEO_MIME_CANDIDATES = [
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
      'video/mp4'
    ];

    function getSupportedMimeType(candidates) {
      if (typeof MediaRecorder === 'undefined') return '';
      for (const type of candidates) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    // Placeholders for each tab
    const placeholders = {
      tasks: "What needs to be done?",
      interruptions: "What pulled you away?",
      learned: "What did you figure out?"
    };

    // Empty states for each tab
    const emptyStates = {
      tasks: {
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>`,
        title: "Ready to slay",
        text: "Write down what needs conquering. No task too small."
      },
      interruptions: {
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>`,
        title: "No interruptions yet",
        text: "When life happens, write it here. It\u2019s not your fault\u2014it\u2019s just reality."
      },
      learned: {
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
        </svg>`,
        title: "Insights await",
        text: "Jot down what you learned today. Every lesson is progress."
      }
    };

    // ==========================================
    // IndexedDB — entries
    // ==========================================

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          const { oldVersion } = event;

          // v1: entries store with type index
          if (oldVersion < 1) {
            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            store.createIndex('type', 'type', { unique: false });
          }

          // v2, v3: no schema changes

          // v4: separate attachments store for native Blob storage
          if (oldVersion < 4) {
            database.createObjectStore(ATTACH_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
      });
    }

    // Write or delete a single entry. op='put' upserts; op='delete' removes by id.
    // Returns the record key for 'put' (useful for new inserts).
    function saveEntry(entry, op = 'put') {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const req = op === 'delete' ? store.delete(entry.id) : store.put(entry);
        req.onsuccess = () => resolve(req.result);
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function loadEntries() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // ==========================================
    // IndexedDB — attachments (Blob storage)
    // ==========================================

    function saveAttachmentBlob(blob, type) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([ATTACH_STORE], 'readwrite');
        const store = transaction.objectStore(ATTACH_STORE);
        const req = store.put({ blob, type, createdAt: Date.now() });
        req.onsuccess = () => resolve(req.result); // auto-generated id
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function getAttachmentRecord(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([ATTACH_STORE], 'readonly');
        const store = transaction.objectStore(ATTACH_STORE);
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result);
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function deleteAttachmentRecord(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([ATTACH_STORE], 'readwrite');
        const store = transaction.objectStore(ATTACH_STORE);
        store.delete(id);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    // ==========================================
    // Migration: inline base64 → Blob store
    // ==========================================

    function dataUrlToBlob(dataUrl) {
      const [header, b64] = dataUrl.split(',');
      const type = header.match(/:(.*?);/)[1];
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    async function migrateAttachments() {
      const toMigrate = entries.filter(e =>
        Array.isArray(e.attachments) &&
        e.attachments.some(a => a && typeof a === 'object' && a.data)
      );
      for (const entry of toMigrate) {
        const newIds = [];
        for (const att of entry.attachments) {
          if (att && typeof att === 'object' && att.data) {
            try {
              const blob = dataUrlToBlob(att.data);
              const id = await saveAttachmentBlob(blob, att.type || blob.type);
              newIds.push(id);
            } catch (err) {
              console.warn('Failed to migrate attachment:', err);
            }
          } else if (typeof att === 'number') {
            newIds.push(att); // already new format
          }
        }
        entry.attachments = newIds;
        await saveEntry(entry);
      }
    }

    // ==========================================
    // Object URL lifecycle
    // ==========================================

    // Ensure all needed attachment IDs have cached object URLs
    async function preloadAttachmentUrls(ids) {
      for (const id of ids) {
        if (!objectUrlCache.has(id)) {
          const rec = await getAttachmentRecord(id);
          if (rec) {
            objectUrlCache.set(id, { url: URL.createObjectURL(rec.blob), type: rec.type });
          }
        }
      }
    }

    // Revoke and remove object URLs for IDs no longer needed
    function revokeStaleObjectUrls(neededIds) {
      const needed = new Set(neededIds);
      for (const [id, { url }] of objectUrlCache) {
        if (!needed.has(id)) {
          URL.revokeObjectURL(url);
          objectUrlCache.delete(id);
        }
      }
    }

    // ==========================================
    // In-memory state
    // ==========================================

    let entries = [];

    function getEntryById(id) {
      return entries.find(e => e.id === id);
    }

    function getEntriesForTab(tabName) {
      return entries.filter(e => e.type === tabName);
    }

    // ==========================================
    // DOM refs
    // ==========================================

    const entryForm = document.getElementById('entryForm');
    const entryInput = document.getElementById('entryInput');
    const entryList = document.getElementById('entryList');
    const paper = document.getElementById('paper');
    const statsLeft = document.getElementById('statsLeft');
    const statsRight = document.getElementById('statsRight');
    const greeting = document.getElementById('greeting');
    const tabs = document.querySelectorAll('.tab');

    // ==========================================
    // Greeting
    // ==========================================

    function updateGreeting() {
      const hour = new Date().getHours();
      const greetings = {
        morning: ['Rise and slay', 'Morning, wildman', 'Time to conquer'],
        afternoon: ['Keep slaying', 'Halfway conquered', 'No stopping now'],
        evening: ['Final push', 'Almost slayed it', 'Finish strong']
      };

      let timeOfDay = 'morning';
      if (hour >= 12 && hour < 17) timeOfDay = 'afternoon';
      else if (hour >= 17) timeOfDay = 'evening';

      const options = greetings[timeOfDay];
      greeting.textContent = options[Math.floor(Math.random() * options.length)];
    }

    // Refresh greeting when returning to the tab
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateGreeting();
    });

    // ==========================================
    // Tab switching
    // ==========================================

    function switchTab(tabName) {
      currentTab = tabName;
      editingId = null;
      pendingDeleteId = null;

      tabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === tabName);
      });

      paper.className = `paper tab-${tabName}`;
      if (tabName === 'interruptions') paper.classList.add('interruptions');
      else if (tabName === 'learned') paper.classList.add('learned');

      entryInput.placeholder = placeholders[tabName];

      renderEntries();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    // ==========================================
    // Rendering
    // ==========================================

    function updateTabCounts() {
      document.getElementById('tasksCount').textContent = entries.filter(e => e.type === 'tasks').length;
      document.getElementById('interruptionsCount').textContent = entries.filter(e => e.type === 'interruptions').length;
      document.getElementById('learnedCount').textContent = entries.filter(e => e.type === 'learned').length;
    }

    function renderAttachments(attachmentIds, entryId) {
      if (!attachmentIds || attachmentIds.length === 0) return '';

      return `
        <div class="attachments">
          ${attachmentIds.map(attId => {
            const cached = objectUrlCache.get(attId);
            if (!cached) return '';
            const { url, type } = cached;

            if (type.startsWith('image/')) {
              return `
                <div class="attachment">
                  <img src="${url}" alt="attachment">
                  <button class="btn-remove-attachment" data-action="remove-attachment" data-id="${entryId}" data-att-id="${attId}">&times;</button>
                </div>
              `;
            } else if (type.startsWith('video/')) {
              return `
                <div class="attachment">
                  <video src="${url}" controls></video>
                  <button class="btn-remove-attachment" data-action="remove-attachment" data-id="${entryId}" data-att-id="${attId}">&times;</button>
                </div>
              `;
            } else if (type.startsWith('audio/')) {
              return `
                <div class="attachment audio-attachment">
                  <audio src="${url}" controls></audio>
                  <button class="btn-remove-attachment" data-action="remove-attachment" data-id="${entryId}" data-att-id="${attId}">&times;</button>
                </div>
              `;
            }
            return '';
          }).join('')}
        </div>
      `;
    }

    async function renderEntries() {
      const tabEntries = getEntriesForTab(currentTab);

      // Collect attachment IDs needed for this render
      const neededIds = tabEntries.flatMap(e =>
        Array.isArray(e.attachments) ? e.attachments.filter(a => typeof a === 'number') : []
      );

      await preloadAttachmentUrls(neededIds);
      revokeStaleObjectUrls(neededIds);

      if (tabEntries.length === 0) {
        const empty = emptyStates[currentTab];
        entryList.innerHTML = `
          <div class="empty-state ${currentTab}">
            <div class="icon">${empty.icon}</div>
            <h2>${empty.title}</h2>
            <p>${empty.text}</p>
          </div>
        `;
      } else {
        entryList.innerHTML = tabEntries.map(entry => {
          const markerClass = currentTab === 'tasks' ? 'task' :
                              currentTab === 'interruptions' ? 'interruption' : 'learned';

          let markerContent = '';
          if (currentTab === 'interruptions') {
            markerContent = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
          } else if (currentTab === 'learned') {
            markerContent = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17H8v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/></svg>`;
          }

          const markerAttrs = currentTab === 'tasks'
            ? `data-action="toggle" data-id="${entry.id}"`
            : '';

          const attachmentIds = Array.isArray(entry.attachments)
            ? entry.attachments.filter(a => typeof a === 'number')
            : [];

          const actionsHtml = pendingDeleteId === entry.id
            ? `<div class="delete-confirm">
                <span>Remove?</span>
                <button class="btn-action confirm" data-action="confirm-delete" data-id="${entry.id}">Yes</button>
                <button class="btn-action" data-action="cancel-delete" data-id="${entry.id}">No</button>
              </div>`
            : `<div class="entry-actions">
                <button class="btn-action" data-action="edit" data-id="${entry.id}">Edit</button>
                <button class="btn-action delete" data-action="delete" data-id="${entry.id}">Delete</button>
              </div>`;

          return `
            <div class="entry ${currentTab} ${entry.completed ? 'completed' : ''}" data-id="${entry.id}">
              <div class="entry-marker ${markerClass}" ${markerAttrs}>${markerContent}</div>
              <div class="entry-content">
                ${editingId === entry.id
                  ? `<input type="text" class="edit-input" value="${escapeHtml(entry.text)}" data-id="${entry.id}" autofocus>`
                  : `<div class="entry-text">${escapeHtml(entry.text)}</div>`
                }
                ${renderAttachments(attachmentIds, entry.id)}
                <div class="media-buttons">
                  <button class="btn-media ${recordingEntryId === entry.id ? 'recording' : ''}" data-action="record-audio" data-id="${entry.id}" title="Record audio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    </svg>
                  </button>
                  <button class="btn-media" data-action="capture-photo" data-id="${entry.id}" title="Take photo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="13" r="4"/>
                      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    </svg>
                  </button>
                  <button class="btn-media" data-action="capture-video" data-id="${entry.id}" title="Record video">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polygon points="23 7 16 12 23 17 23 7"/>
                      <rect x="1" y="5" width="15" height="14" rx="2"/>
                    </svg>
                  </button>
                  <button class="btn-media" data-action="pick-file" data-id="${entry.id}" title="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                  </button>
                </div>
              </div>
              ${actionsHtml}
            </div>
          `;
        }).join('');
      }

      updateStats();
      updateTabCounts();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateStats() {
      const tasks = entries.filter(e => e.type === 'tasks');
      const completed = tasks.filter(t => t.completed).length;
      const interruptions = entries.filter(e => e.type === 'interruptions').length;
      const learned = entries.filter(e => e.type === 'learned').length;

      const total = tasks.length + interruptions + learned;

      if (total === 0) {
        statsLeft.textContent = 'Ready to slay';
        statsRight.textContent = '';
      } else {
        const parts = [];
        if (tasks.length > 0) {
          const remaining = tasks.length - completed;
          if (remaining === 0) {
            parts.push(`<span class="tasks-stat highlight">All done!</span>`);
          } else {
            parts.push(`${remaining} ${remaining === 1 ? 'task' : 'tasks'} left`);
          }
        }
        statsLeft.innerHTML = parts.length > 0 ? parts.join(' ') : 'Your day so far';

        const rightParts = [];
        if (completed > 0) rightParts.push(`<span class="tasks-stat">${completed} done</span>`);
        if (interruptions > 0) rightParts.push(`<span class="interrupt-stat">${interruptions} interruption${interruptions !== 1 ? 's' : ''}</span>`);
        if (learned > 0) rightParts.push(`<span class="learned-stat">${learned} insight${learned !== 1 ? 's' : ''}</span>`);

        statsRight.innerHTML = rightParts.join(' · ');
      }
    }

    // ==========================================
    // Delegated event handling — entryList
    // ==========================================

    entryList.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;
      const id = parseInt(btn.dataset.id, 10);

      switch (action) {
        case 'toggle':
          await toggleEntry(id);
          break;
        case 'edit':
          editEntry(id);
          break;
        case 'delete':
          pendingDeleteId = id;
          await renderEntries();
          break;
        case 'confirm-delete':
          await deleteEntry(id);
          break;
        case 'cancel-delete':
          pendingDeleteId = null;
          await renderEntries();
          break;
        case 'remove-attachment':
          await removeAttachment(id, parseInt(btn.dataset.attId, 10));
          break;
        case 'record-audio':
          await toggleAudioRecording(id);
          break;
        case 'capture-photo':
          await capturePhoto(id);
          break;
        case 'capture-video':
          await captureVideo(id);
          break;
        case 'pick-file':
          pickFile(id);
          break;
      }
    });

    // Double-click on entry text to edit
    entryList.addEventListener('dblclick', (e) => {
      const text = e.target.closest('.entry-text');
      if (!text) return;
      const entryEl = e.target.closest('.entry');
      if (!entryEl) return;
      editEntry(parseInt(entryEl.dataset.id, 10));
    });

    // Edit input: Enter key commits (via blur), Escape discards
    entryList.addEventListener('keydown', (e) => {
      if (!e.target.classList.contains('edit-input')) return;
      if (e.key === 'Enter') {
        e.target.blur(); // triggers the blur handler below
      } else if (e.key === 'Escape') {
        editingId = null;
        renderEntries();
      }
    });

    // Edit input: blur commits the edit (unless Escape already cleared editingId)
    entryList.addEventListener('blur', (e) => {
      if (!e.target.classList.contains('edit-input')) return;
      if (editingId === null) return; // Escape was pressed
      const entryEl = e.target.closest('.entry');
      if (!entryEl) return;
      saveEdit(parseInt(entryEl.dataset.id, 10), e.target.value);
    }, true /* capture — blur doesn't bubble */);

    // ==========================================
    // Entry actions
    // ==========================================

    async function toggleEntry(id) {
      const entry = getEntryById(id);
      if (!entry || entry.type !== 'tasks') return;
      entry.completed = !entry.completed;
      await saveEntry(entry);
      await renderEntries();
    }

    function editEntry(id) {
      editingId = id;
      renderEntries().then(() => {
        requestAnimationFrame(() => {
          const input = entryList.querySelector('.edit-input');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        });
      });
    }

    async function saveEdit(id, newText) {
      if (editingId !== id) return; // guard against double-fire from Enter+blur
      const entry = getEntryById(id);
      if (!entry) return;
      const trimmed = newText.trim();
      if (trimmed) entry.text = trimmed;
      editingId = null;
      await saveEntry(entry);
      await renderEntries();
    }

    async function deleteEntry(id) {
      const index = entries.findIndex(e => e.id === id);
      if (index === -1) return;

      // Clean up any attachments
      const attachmentIds = Array.isArray(entries[index].attachments)
        ? entries[index].attachments.filter(a => typeof a === 'number')
        : [];
      for (const attId of attachmentIds) {
        if (objectUrlCache.has(attId)) {
          URL.revokeObjectURL(objectUrlCache.get(attId).url);
          objectUrlCache.delete(attId);
        }
        await deleteAttachmentRecord(attId);
      }

      await saveEntry({ id }, 'delete');
      entries.splice(index, 1);
      pendingDeleteId = null;
      await renderEntries();
    }

    // ==========================================
    // Attachments
    // ==========================================

    async function addAttachment(entryId, blob, type) {
      const attId = await saveAttachmentBlob(blob, type);
      const entry = getEntryById(entryId);
      if (!entry) return;
      if (!Array.isArray(entry.attachments)) entry.attachments = [];
      entry.attachments.push(attId);
      await saveEntry(entry);
      await renderEntries();
    }

    async function removeAttachment(entryId, attId) {
      const entry = getEntryById(entryId);
      if (!entry || !Array.isArray(entry.attachments)) return;
      entry.attachments = entry.attachments.filter(id => id !== attId);

      if (objectUrlCache.has(attId)) {
        URL.revokeObjectURL(objectUrlCache.get(attId).url);
        objectUrlCache.delete(attId);
      }
      await deleteAttachmentRecord(attId);
      await saveEntry(entry);
      await renderEntries();
    }

    // ==========================================
    // Audio recording
    // ==========================================

    async function toggleAudioRecording(entryId) {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        currentAudioMime = getSupportedMimeType(AUDIO_MIME_CANDIDATES);
        const options = currentAudioMime ? { mimeType: currentAudioMime } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];
        recordingEntryId = entryId;

        mediaRecorder.ondataavailable = (e) => {
          audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const blob = new Blob(audioChunks, { type: currentAudioMime || 'audio/webm' });
          await addAttachment(recordingEntryId, blob, blob.type);
          recordingEntryId = null;
          mediaRecorder = null;
        };

        mediaRecorder.start();
        await renderEntries();
      } catch (err) {
        alert('Could not access microphone. Please allow microphone access.');
        recordingEntryId = null;
      }
    }

    // ==========================================
    // Photo capture
    // ==========================================

    async function capturePhoto(entryId) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });

        const modal = document.createElement('div');
        modal.className = 'capture-modal';
        modal.innerHTML = `
          <div class="capture-modal-preview">
            <video autoplay playsinline></video>
          </div>
          <div class="capture-modal-actions">
            <button class="btn-capture-primary">Capture</button>
            <button class="btn-capture-cancel">Cancel</button>
          </div>
        `;
        document.body.appendChild(modal);

        const modalVideo = modal.querySelector('video');
        modalVideo.srcObject = stream;

        modal.querySelector('.btn-capture-cancel').addEventListener('click', () => {
          stream.getTracks().forEach(track => track.stop());
          modal.remove();
        });

        modal.querySelector('.btn-capture-primary').addEventListener('click', () => {
          const canvas = document.createElement('canvas');
          canvas.width = modalVideo.videoWidth;
          canvas.height = modalVideo.videoHeight;
          canvas.getContext('2d').drawImage(modalVideo, 0, 0);
          canvas.toBlob(async (blob) => {
            stream.getTracks().forEach(track => track.stop());
            modal.remove();
            await addAttachment(entryId, blob, 'image/jpeg');
          }, 'image/jpeg', 0.8);
        });
      } catch (err) {
        alert('Could not access camera. Please allow camera access.');
      }
    }

    // ==========================================
    // Video capture
    // ==========================================

    async function captureVideo(entryId) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true });
        const videoMime = getSupportedMimeType(VIDEO_MIME_CANDIDATES);
        let videoRecorder;
        let videoChunks = [];

        const modal = document.createElement('div');
        modal.className = 'capture-modal';
        modal.innerHTML = `
          <div class="capture-modal-preview">
            <video autoplay playsinline muted></video>
          </div>
          <div class="capture-modal-actions">
            <button class="btn-capture-record">Start Recording</button>
            <button class="btn-capture-cancel">Cancel</button>
          </div>
        `;
        document.body.appendChild(modal);

        const modalVideo = modal.querySelector('video');
        modalVideo.srcObject = stream;

        const recordBtn = modal.querySelector('.btn-capture-record');
        let isRecording = false;

        modal.querySelector('.btn-capture-cancel').addEventListener('click', () => {
          if (videoRecorder && videoRecorder.state === 'recording') {
            videoRecorder.stop();
          }
          stream.getTracks().forEach(track => track.stop());
          modal.remove();
        });

        recordBtn.addEventListener('click', () => {
          if (!isRecording) {
            videoChunks = [];
            const options = videoMime ? { mimeType: videoMime } : {};
            videoRecorder = new MediaRecorder(stream, options);
            videoRecorder.ondataavailable = (e) => videoChunks.push(e.data);
            videoRecorder.onstop = async () => {
              const blob = new Blob(videoChunks, { type: videoMime || 'video/webm' });
              stream.getTracks().forEach(track => track.stop());
              modal.remove();
              await addAttachment(entryId, blob, blob.type);
            };
            videoRecorder.start();
            recordBtn.textContent = 'Stop Recording';
            recordBtn.classList.add('recording');
            isRecording = true;
          } else {
            videoRecorder.stop();
          }
        });
      } catch (err) {
        alert('Could not access camera/microphone. Please allow access.');
      }
    }

    // ==========================================
    // File picker
    // ==========================================

    function pickFile(entryId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,video/*,audio/*';
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) await addAttachment(entryId, file, file.type);
      });
      input.click();
    }

    // ==========================================
    // Form submit — add new entry
    // ==========================================

    entryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = entryInput.value.trim();
      if (!text) return;

      const entryData = { text, type: currentTab, completed: false, createdAt: Date.now() };
      const id = await saveEntry(entryData);
      entryData.id = id;
      entries.push(entryData);

      entryInput.value = '';
      await renderEntries();
    });

    // ==========================================
    // Init
    // ==========================================

    async function init() {
      try {
        db = await openDB();
        entries = await loadEntries();
        await migrateAttachments();
        await renderEntries();
        updateGreeting();
      } catch (error) {
        console.error('Init failed:', error);
        document.getElementById('paper').innerHTML = `
          <div class="error-state">
            <p>Could not load your data. Please refresh the page.</p>
            <button id="retryBtn">Refresh</button>
          </div>
        `;
        document.getElementById('retryBtn').addEventListener('click', () => window.location.reload());
      }
    }

    init();

    // ==========================================
    // PWA: Service Worker & Install Prompt
    // ==========================================

    let deferredPrompt = null;
    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          swRegistration = await navigator.serviceWorker.register('./sw.js');
          console.log('Service Worker registered:', swRegistration.scope);

          swRegistration.addEventListener('updatefound', () => {
            const newWorker = swRegistration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('updateBanner').classList.add('show');
              }
            });
          });
        } catch (error) {
          console.error('Service Worker registration failed:', error);
        }
      });

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }

    document.getElementById('updateBtn').addEventListener('click', () => {
      if (swRegistration && swRegistration.waiting) {
        swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      document.getElementById('updateBanner').classList.remove('show');
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;

      const dismissed = localStorage.getItem('installBannerDismissed');
      const dismissedTime = dismissed ? parseInt(dismissed, 10) : 0;
      const daysSinceDismissed = (Date.now() - dismissedTime) / (1000 * 60 * 60 * 24);

      if (!dismissed || daysSinceDismissed > 7) {
        setTimeout(() => {
          document.getElementById('installBanner').classList.add('show');
        }, 2000);
      }
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Install prompt outcome:', outcome);
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });

    document.getElementById('dismissBtn').addEventListener('click', () => {
      document.getElementById('installBanner').classList.remove('show');
      localStorage.setItem('installBannerDismissed', Date.now().toString());
    });

    window.addEventListener('appinstalled', () => {
      console.log('App installed successfully');
      document.getElementById('installBanner').classList.remove('show');
      deferredPrompt = null;
    });

    // Offline / online status
    const offlineIndicator = document.getElementById('offlineIndicator');

    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineIndicator.classList.add('show');
      } else {
        offlineIndicator.classList.remove('show');
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
